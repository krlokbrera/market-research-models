[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-research-models"
version = "0.1.0"
description = "Local quantitative models for traditional and crypto markets"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.3,<2",
]

[project.scripts]
market-models = "market_models.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

